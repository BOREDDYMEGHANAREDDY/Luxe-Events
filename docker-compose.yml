version: '3.9'

services:
  # ─── MongoDB ──────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: luxe-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: luxe_admin_pass
      MONGO_INITDB_DATABASE: luxeevents
    volumes:
      - mongo_data:/data/db
    networks:
      - luxe-network

  # ─── Mongo Express (DB viewer) ────────────────────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: luxe-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: luxe_admin_pass
      ME_CONFIG_MONGODB_URL: mongodb://admin:luxe_admin_pass@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongo
    networks:
      - luxe-network

  # ─── Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luxe-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://admin:luxe_admin_pass@mongo:27017/luxeevents?authSource=admin
      JWT_SECRET: docker_jwt_secret_change_in_production
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost:3000
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    networks:
      - luxe-network
    command: npm run dev

  # ─── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luxe-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - luxe-network
    command: npm start

volumes:
  mongo_data:
    driver: local

networks:
  luxe-network:
    driver: bridge
